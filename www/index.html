<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holistic Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="logo">H</div>
    <nav>
      <a href="#" class="tab-btn active" data-tab="portfolio">💰</a>
      <a href="#" class="tab-btn" data-tab="projection">📈</a>
      <button id="themeToggle">☀️</button>
    </nav>
  </div>

  <div class="main">
    <header>
      <h1>Holistic Portfolio</h1>
      <input type="text" placeholder="🔍 Search..." />
    </header>

    <!-- Portfolio Tracker Tab -->
    <div class="tab-content active" id="portfolio">
      <section class="top-section">
        <div class="chart-card">
          <h2>Portfolio Allocation</h2>
          <canvas id="portfolioChart"></canvas>
        </div>
        <div class="portfolio-card">
          <h2>Overview</h2>
          <p>Total: <strong id="portfolioTotal">0 €</strong></p>
          <ul id="portfolioBreakdown"></ul>
        </div>
      </section>

      <section class="stock-section">
        <div class="stock-inputs">
          <h2>Add Asset</h2>
          <form id="portfolioForm">
            <label>Category:
              <select id="portfolioCategory">
                <option value="Real Estate">Real Estate</option>
                <option value="Cash">Cash</option>
                <option value="Stocks">Stocks</option>
                <option value="Crypto">Crypto</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label>Name: <input type="text" id="portfolioName" required /></label>
            <label>Value (€): <input type="number" id="portfolioValue" required /></label>
            <button type="submit">Add</button>
          </form>
        </div>
        <div class="stock-list">
          <h2>My Assets</h2>
          <ul id="portfolioList"></ul>
        </div>
      </section>
    </div>

    <!-- Projection Calculator Tab -->
    <div class="tab-content" id="projection">
      <section class="chart-card">
        <h2>Projection Calculator</h2>
        <form id="projectionForm" class="projection-form">
          <label>Initial Investment (€): <input type="number" id="projInitial" required /></label>
          <label>Monthly Contribution (€): <input type="number" id="projMonthly" required /></label>
          <label>Expected Annual Return (%): <input type="number" id="projReturn" required /></label>
          <label>Years: <input type="number" id="projYears" required /></label>
          <button type="submit">Calculate</button>
        </form>
        <canvas id="projectionChart"></canvas>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
